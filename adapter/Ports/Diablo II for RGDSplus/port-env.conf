# RGDSplus card-two settings; paths follow this game's actual location.
export WINEDEBUG=-all
export D2_PLATFORM=rgdsplus
export PATH="$port/bin:$PATH"
export D2_SDL_VIDEO_DRIVER=wayland
export D2_AUDIO_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/var/run}
export D2_PRESENT_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/var/run}
export D2_PRESENT_WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
export XDG_RUNTIME_DIR="$D2_PRESENT_RUNTIME_DIR"
export WAYLAND_DISPLAY="$D2_PRESENT_WAYLAND_DISPLAY"
export SDL_VIDEODRIVER=wayland
export SDL_VIDEO_MINIMIZE_ON_FOCUS_LOSS=0
export PULSE_SERVER=${PULSE_SERVER:-unix:/tmp/pulse-socket}
export D2_SDL_DISPLAY_INDEX=0
export D2_PHYSICAL_WIDTH=1024
export D2_PHYSICAL_HEIGHT=768
export DISPLAY_WIDTH=1024
export DISPLAY_HEIGHT=768
